name: Deploy GitHub Pages (prompts site)

on:
  push:
    branches: [main]
    paths:
      - 'prompts/**'
      - 'README.md'
      - 'README_CN.md'
      - '.github/workflows/pages.yml'
      - '.github/scripts/build_pages.py'
      - 'ARCHITECTURE.md'
      - 'ARCHITECTURE_CN.md'
      - 'EXTENDING.md'
      - 'EXTENDING_CN.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install rendering deps
        run: |
          python -m pip install --upgrade pip
          pip install "markdown>=3.6" "pygments>=2.17"

      - name: Build site
        run: python .github/scripts/build_pages.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-pages-site
          path: site/
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Deploy to gh-pages branch
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download built site
        uses: actions/download-artifact@v4
        with:
          name: github-pages-site
          path: site

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          keep_files: false
          commit_message: "Deploy prompts/ site (commit ${{ github.sha }})"
          full_commit_message: "Auto-deploy GitHub Stars Analyzer site

- Source: ${{ github.sha }}
- Triggered by: ${{ github.actor }}
- Workflow: ${{ github.workflow }} #${{ github.run_number }}
"